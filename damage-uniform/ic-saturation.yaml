!LuaMap
  returns: [eps_xx, eps_yy, eps_zz, eps_xy, eps_yz, eps_xz, v1, v2, v3, alpha, breakage]
  function: |
    function f (x)
        -- The strain of this scenario lives in the initial strain of the
        -- material file, not in the state, so the state starts at zero and
        -- stays there: nothing but the two internal variables moves.
        -- As the growth case, but capped: the guard reads the mean damage at the start of a step, so the run overshoots one by one step of growth and no more.
        return {
            eps_xx = 0.0,
            eps_yy = 0.0,
            eps_zz = 0.0,
            eps_xy = 0.0,
            eps_yz = 0.0,
            eps_xz = 0.0,
            v1 = 0.0,
            v2 = 0.0,
            v3 = 0.0,
            alpha = math.min(0.18 * x["t"], 1.0),
            breakage = 0.0
        }
    end
