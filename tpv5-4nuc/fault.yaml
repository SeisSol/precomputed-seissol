[nuc_xy, nuc2_xy, nuc3_xy, nuc4_xy]: !LuaMap
  returns: [nuc_xy, nuc2_xy, nuc3_xy, nuc4_xy]
  # in essence, run four nucleations from one side to the other
  function: |
      function f (x)
        r = math.sqrt((x["x"]-9000)^2 + x["y"]^2 + (x["z"]+7500)^2)
        if (r <= 1500.0) then
          nuc_xy = 25000000.0 * math.exp(r*r / (r*r - 9000000))
        else
          nuc_xy = 0.0
        end

        r = math.sqrt((x["x"]-3000)^2 + x["y"]^2 + (x["z"]+7500)^2)
        if (r <= 1500.0) then
          nuc2_xy = 25000000.0 * math.exp(r*r / (r*r - 9000000))
        else
          nuc2_xy = 0.0
        end

        r = math.sqrt((x["x"]+3000)^2 + x["y"]^2 + (x["z"]+7500)^2)
        if (r <= 1500.0) then
          nuc3_xy = 25000000.0 * math.exp(r*r / (r*r - 9000000))
        else
          nuc3_xy = 0.0
        end

        r = math.sqrt((x["x"]+9000)^2 + x["y"]^2 + (x["z"]+7500)^2)
        if (r <= 1500.0) then
          nuc4_xy = 25000000.0 * math.exp(r*r / (r*r - 9000000))
        else
          nuc4_xy = 0.0
        end

        return {
          nuc_xy = nuc_xy,
          nuc2_xy = nuc2_xy,
          nuc3_xy = nuc3_xy,
          nuc4_xy = nuc4_xy,
        }
      end
